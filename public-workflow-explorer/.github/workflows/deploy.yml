name: Deploy DPDP Workflow Explorer to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20+
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: |
          if [ -d "public-workflow-explorer" ]; then
            cd public-workflow-explorer && npm install
          else
            npm install
          fi

      - name: Build Static App
        run: |
          if [ -d "public-workflow-explorer" ]; then
            cd public-workflow-explorer && npm run build
          else
            npm run build
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ hashFiles('public-workflow-explorer/dist/index.html') != '' && 'public-workflow-explorer/dist' || 'dist' }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

